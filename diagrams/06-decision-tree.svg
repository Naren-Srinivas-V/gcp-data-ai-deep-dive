<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="440" fill="#FFFFFF"/>
  <text x="500" y="40" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Choosing the right Data/AI tool</text>

  <rect x="380" y="60" width="240" height="60" rx="12" fill="#16224F"/>
  <text x="500" y="95" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">What do you need to do?</text>

  <line x1="480" y1="120" x2="150" y2="170" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="500" y1="120" x2="500" y2="170" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="520" y1="120" x2="850" y2="170" stroke="#6B7280" stroke-width="1.5"/>

  <rect x="40" y="170" width="220" height="70" rx="12" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="150" y="200" font-size="12" fill="#1B3A8C" text-anchor="middle" font-weight="bold">Move events between</text>
  <text x="150" y="217" font-size="12" fill="#1B3A8C" text-anchor="middle" font-weight="bold">systems, reliably</text>

  <rect x="390" y="170" width="220" height="70" rx="12" fill="#E1F5EE" stroke="#00A896" stroke-width="2"/>
  <text x="500" y="200" font-size="12" fill="#00695C" text-anchor="middle" font-weight="bold">Transform/analyze a</text>
  <text x="500" y="217" font-size="12" fill="#00695C" text-anchor="middle" font-weight="bold">stream or big batch</text>

  <rect x="740" y="170" width="220" height="70" rx="12" fill="#FBEAF0" stroke="#F96167" stroke-width="2"/>
  <text x="850" y="200" font-size="12" fill="#B0293A" text-anchor="middle" font-weight="bold">Train or serve a</text>
  <text x="850" y="217" font-size="12" fill="#B0293A" text-anchor="middle" font-weight="bold">machine learning model</text>

  <line x1="150" y1="240" x2="150" y2="270" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="60" y="270" width="180" height="55" rx="10" fill="#4285F4"/>
  <text x="150" y="303" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Pub/Sub</text>

  <line x1="500" y1="240" x2="350" y2="270" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="500" y1="240" x2="650" y2="270" stroke="#6B7280" stroke-width="1.5"/>

  <rect x="260" y="270" width="180" height="70" rx="10" fill="#00A896"/>
  <text x="350" y="298" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Dataflow</text>
  <text x="350" y="315" font-size="10" fill="#FFFFFF" text-anchor="middle">continuous stream</text>

  <rect x="560" y="270" width="180" height="70" rx="10" fill="#2C8C7C"/>
  <text x="650" y="298" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Dataproc</text>
  <text x="650" y="315" font-size="10" fill="#FFFFFF" text-anchor="middle">one-off big Spark job</text>

  <line x1="850" y1="240" x2="850" y2="270" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="760" y="270" width="180" height="55" rx="10" fill="#F96167"/>
  <text x="850" y="303" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Vertex AI</text>

  <text x="500" y="400" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    These four tools aren't competitors — real pipelines usually chain several of them together,
  </text>
  <text x="500" y="422" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    exactly as shown in the end-to-end pipeline diagram above.
  </text>
</svg>
