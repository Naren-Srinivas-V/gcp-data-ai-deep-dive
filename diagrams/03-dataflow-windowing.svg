<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="380" fill="#FFFFFF"/>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Dataflow — windowing a continuous stream</text>

  <!-- timeline -->
  <line x1="60" y1="180" x2="940" y2="180" stroke="#6B7280" stroke-width="2"/>
  <text x="60" y="205" font-size="11" fill="#6B7280">time →</text>

  <!-- events -->
  <g fill="#4285F4">
    <circle cx="110" cy="180" r="6"/>
    <circle cx="150" cy="180" r="6"/>
    <circle cx="200" cy="180" r="6"/>
    <circle cx="280" cy="180" r="6"/>
    <circle cx="330" cy="180" r="6"/>
    <circle cx="380" cy="180" r="6"/>
    <circle cx="470" cy="180" r="6"/>
    <circle cx="520" cy="180" r="6"/>
    <circle cx="560" cy="180" r="6"/>
    <circle cx="650" cy="180" r="6"/>
    <circle cx="700" cy="180" r="6"/>
    <circle cx="760" cy="180" r="6"/>
    <circle cx="850" cy="180" r="6"/>
    <circle cx="890" cy="180" r="6"/>
  </g>

  <!-- windows -->
  <rect x="80" y="130" width="280" height="100" rx="10" fill="#E1F5EE" stroke="#00A896" stroke-width="2" opacity="0.85"/>
  <text x="220" y="120" font-size="12" fill="#00695C" text-anchor="middle" font-weight="bold">Window 1: 09:00–09:05</text>

  <rect x="410" y="130" width="280" height="100" rx="10" fill="#E8F0FE" stroke="#4285F4" stroke-width="2" opacity="0.85"/>
  <text x="550" y="120" font-size="12" fill="#1B3A8C" text-anchor="middle" font-weight="bold">Window 2: 09:05–09:10</text>

  <rect x="740" y="130" width="200" height="100" rx="10" fill="#FBEAF0" stroke="#F96167" stroke-width="2" opacity="0.85"/>
  <text x="840" y="120" font-size="12" fill="#B0293A" text-anchor="middle" font-weight="bold">Window 3: 09:10–...</text>

  <text x="500" y="300" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    A stream never "ends" — windowing groups events into finite time chunks so aggregations
  </text>
  <text x="500" y="322" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    ("total orders per 5 minutes") become possible on data that keeps arriving forever.
  </text>
</svg>
