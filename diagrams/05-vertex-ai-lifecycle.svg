<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="380" fill="#FFFFFF"/>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#16224F" stroke-width="2"/>
    </marker>
  </defs>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Vertex AI — the machine learning lifecycle</text>

  <rect x="30" y="140" width="170" height="90" rx="14" fill="#16224F"/>
  <text x="115" y="175" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Training data</text>
  <text x="115" y="195" font-size="10" fill="#CADCFC" text-anchor="middle">(Chapter 3 storage)</text>

  <rect x="245" y="140" width="170" height="90" rx="14" fill="#4285F4"/>
  <text x="330" y="175" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Training job</text>
  <text x="330" y="195" font-size="10" fill="#E8F0FE" text-anchor="middle">AutoML or custom</text>

  <rect x="460" y="140" width="170" height="90" rx="14" fill="#00A896"/>
  <text x="545" y="175" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Model Registry</text>
  <text x="545" y="195" font-size="10" fill="#FFFFFF" text-anchor="middle">versioned, tracked</text>

  <rect x="675" y="140" width="170" height="90" rx="14" fill="#F96167"/>
  <text x="760" y="175" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Endpoint</text>
  <text x="760" y="195" font-size="10" fill="#FFFFFF" text-anchor="middle">deployed for serving</text>

  <rect x="890" y="140" width="90" height="90" rx="14" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="935" y="180" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">Prediction</text>
  <text x="935" y="196" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">result</text>

  <line x1="200" y1="185" x2="240" y2="185" stroke="#16224F" stroke-width="2.5" marker-end="url(#a5)"/>
  <line x1="415" y1="185" x2="455" y2="185" stroke="#16224F" stroke-width="2.5" marker-end="url(#a5)"/>
  <line x1="630" y1="185" x2="670" y2="185" stroke="#16224F" stroke-width="2.5" marker-end="url(#a5)"/>
  <line x1="845" y1="185" x2="885" y2="185" stroke="#16224F" stroke-width="2.5" marker-end="url(#a5)"/>

  <text x="500" y="300" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    Training happens once (or periodically); the deployed endpoint then answers
  </text>
  <text x="500" y="322" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
