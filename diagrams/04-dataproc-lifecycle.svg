<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="360" fill="#FFFFFF"/>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#16224F" stroke-width="2"/>
    </marker>
  </defs>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Dataproc — the ephemeral cluster pattern</text>

  <rect x="40" y="140" width="180" height="90" rx="14" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="130" y="180" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">1. Spin up</text>
  <text x="130" y="200" font-size="11" fill="#6B7280" text-anchor="middle">a fresh Spark cluster</text>

  <rect x="280" y="140" width="180" height="90" rx="14" fill="#4285F4"/>
  <text x="370" y="180" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2. Run the job</text>
  <text x="370" y="200" font-size="11" fill="#E8F0FE" text-anchor="middle">process the dataset</text>

  <rect x="520" y="140" width="180" height="90" rx="14" fill="#00A896"/>
  <text x="610" y="180" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3. Write results</text>
  <text x="610" y="200" font-size="11" fill="#FFFFFF" text-anchor="middle">to Cloud Storage/BigQuery</text>

  <rect x="760" y="140" width="200" height="90" rx="14" fill="#F96167"/>
  <text x="860" y="180" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4. Tear down</text>
  <text x="860" y="200" font-size="11" fill="#FFFFFF" text-anchor="middle">delete the cluster — $0 idle</text>

  <line x1="220" y1="185" x2="275" y2="185" stroke="#16224F" stroke-width="2.5" marker-end="url(#a4)"/>
  <line x1="460" y1="185" x2="515" y2="185" stroke="#16224F" stroke-width="2.5" marker-end="url(#a4)"/>
  <line x1="700" y1="185" x2="755" y2="185" stroke="#16224F" stroke-width="2.5" marker-end="url(#a4)"/>

  <text x="500" y="290" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    Unlike an always-on Compute Engine cluster you'd manage yourself, a Dataproc cluster is
  </text>
  <text x="500" y="312" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    often created just for one job and destroyed right after — you pay only for the minutes it ran.
  </text>
</svg>
