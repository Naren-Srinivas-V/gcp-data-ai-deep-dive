<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#4285F4" stroke-width="2"/>
    </marker>
  </defs>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Pub/Sub — one topic, many independent subscribers</text>

  <!-- publisher -->
  <rect x="40" y="170" width="140" height="80" rx="14" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="110" y="215" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">Publisher</text>

  <!-- topic -->
  <rect x="260" y="170" width="150" height="80" rx="14" fill="#16224F"/>
  <text x="335" y="205" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Topic</text>
  <text x="335" y="223" font-size="10" fill="#CADCFC" text-anchor="middle">orders-created</text>

  <line x1="180" y1="210" x2="255" y2="210" stroke="#4285F4" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- subscriptions -->
  <rect x="500" y="60" width="200" height="70" rx="12" fill="#E1F5EE" stroke="#00A896" stroke-width="2"/>
  <text x="600" y="90" font-size="12" fill="#00695C" text-anchor="middle" font-weight="bold">Subscription: billing</text>
  <text x="600" y="108" font-size="10" fill="#00695C" text-anchor="middle">charges the customer</text>

  <rect x="500" y="170" width="200" height="70" rx="12" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="600" y="200" font-size="12" fill="#1B3A8C" text-anchor="middle" font-weight="bold">Subscription: shipping</text>
  <text x="600" y="218" font-size="10" fill="#1B3A8C" text-anchor="middle">creates a shipment</text>

  <rect x="500" y="280" width="200" height="70" rx="12" fill="#FBEAF0" stroke="#F96167" stroke-width="2"/>
  <text x="600" y="310" font-size="12" fill="#B0293A" text-anchor="middle" font-weight="bold">Subscription: analytics</text>
  <text x="600" y="328" font-size="10" fill="#B0293A" text-anchor="middle">logs the event to BigQuery</text>

  <line x1="410" y1="200" x2="495" y2="105" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="410" y1="210" x2="495" y2="205" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="410" y1="220" x2="495" y2="310" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a2)"/>

  <text x="500" y="390" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    The publisher never knows or cares who's listening — each subscription gets its own full copy of every message.
  </text>
</svg>
