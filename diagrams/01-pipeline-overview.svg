<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#16224F" stroke-width="2"/>
    </marker>
  </defs>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">A typical data pipeline, end to end</text>

  <!-- source -->
  <rect x="20" y="150" width="150" height="90" rx="14" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="95" y="188" font-size="13" fill="#374151" text-anchor="middle" font-weight="bold">App / Device</text>
  <text x="95" y="208" font-size="11" fill="#6B7280" text-anchor="middle">(events happen)</text>

  <!-- pubsub -->
  <rect x="210" y="150" width="150" height="90" rx="14" fill="#4285F4"/>
  <text x="285" y="188" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Pub/Sub</text>
  <text x="285" y="208" font-size="11" fill="#E8F0FE" text-anchor="middle">ingest &amp; buffer</text>

  <!-- dataflow -->
  <rect x="400" y="150" width="150" height="90" rx="14" fill="#00A896"/>
  <text x="475" y="188" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Dataflow</text>
  <text x="475" y="208" font-size="11" fill="#FFFFFF" text-anchor="middle">transform, in real time</text>

  <!-- storage -->
  <rect x="590" y="150" width="150" height="90" rx="14" fill="#16224F"/>
  <text x="665" y="188" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">BigQuery /</text>
  <text x="665" y="206" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Bigtable</text>
  <text x="665" y="222" font-size="10" fill="#CADCFC" text-anchor="middle">(Chapter 3)</text>

  <!-- vertex ai -->
  <rect x="780" y="150" width="180" height="90" rx="14" fill="#F96167"/>
  <text x="870" y="188" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Vertex AI</text>
  <text x="870" y="208" font-size="11" fill="#FFFFFF" text-anchor="middle">train &amp; predict</text>

  <line x1="170" y1="195" x2="205" y2="195" stroke="#16224F" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="360" y1="195" x2="395" y2="195" stroke="#16224F" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="550" y1="195" x2="585" y2="195" stroke="#16224F" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="740" y1="195" x2="775" y2="195" stroke="#16224F" stroke-width="2.5" marker-end="url(#a1)"/>

  <text x="500" y="310" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    Pub/Sub decouples producers from consumers. Dataflow processes the stream. The result lands
  </text>
  <text x="500" y="332" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    in a Chapter 3 storage engine — which Vertex AI can then train models on, or serve predictions from.
  </text>
</svg>
